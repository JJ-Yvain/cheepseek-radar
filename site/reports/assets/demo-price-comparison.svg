<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="chartTitle chartDesc">
  <title id="chartTitle">DeepSeek Coding Plan 每 1 亿 token 等效价</title>
  <desc id="chartDesc">2026-11-02 快照，缓存/普通输入/模型输出 95/4/1、峰谷 6:4、汇率 6.65。Command Code GOAT 与 OpenCode Go 的 DeepSeek V4.1 Flash 并列最低，约 1.58 元每亿 token；Ollama Pro 约 5.27 元；官方 API 约 15.84 元。</desc>

  <rect width="1200" height="640" fill="#faf8f2"/>

  <text x="44" y="62" font-family="'Source Han Serif SC','Noto Serif SC','Songti SC',Georgia,serif" font-size="34" font-weight="700" fill="#221f19">DeepSeek Coding Plan 每 1 亿 token 等效价</text>
  <text x="44" y="94" font-family="'Source Han Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="17" fill="#7b7361">2026-11-02 快照 · 单位：¥ / 亿 tokens · 缓存/输入/输出 95/4/1 · 峰谷 6:4 · 汇率 6.65</text>

