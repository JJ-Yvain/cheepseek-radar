  <g font-family="'Source Han Sans SC','Noto Sans SC','Microsoft YaHei',sans-serif" font-size="12.5" fill="#9a9284">
    <text x="44" y="594">注：订阅渠道按「实际月费口径」折算，即按量每亿价 ×（月费 ÷ 月额度）；官方 API 为人民币直算后按 6.65 折算。</text>
    <text x="44" y="616">OC 的 $100 额度是否含 4× 促销仍待核实；CC 页面未显式标注 1017。图内数字仅代表 2026-11-02 快照。</text>
